# STAR-LDM FineWeb pretraining config
# Usage:
#   accelerate launch scripts/train.py --config configs/train_fineweb.yaml
#   # Override from CLI:
#   accelerate launch scripts/train.py --config configs/train_fineweb.yaml \
#       train.learning_rate=1e-4 train.train_batch_size=8

# --- Diffusion sampling (inference) ---
sampling:
  noise_schedule_name: cosine
  noise_schedule_scale: 1.0
  sampling_timesteps: 250
  num_samples: 250
  sampler: ddpm
  var_lambda: 0.2

# --- Diffusion loss ---
diffusion_loss:
  weighting_name: sigmoid
  weighting_kwargs:
    gamma_shift: 0.0
  train_schedule: cosine
  cosine_shift: 0.0

# --- Soft prompt generator architecture ---
prompt_generator:
  dim: 1024
  dim_head: 64
  depth: 6
  prompt_length: 8
  dropout: 0.1

# --- Score network head architecture ---
scorenet_head:
  dim: 1024
  depth: 6
  dropout: 0.1
  output_dim_mult: 4

# --- Training ---
train:
  optimizer: adamw
  train_batch_size: 16
  num_train_steps: 250000
  gradient_accumulation_steps: 2
  learning_rate: 5e-4
  lr_schedule: wsd
  lr_warmup_steps: 1000
  betas: [0.9, 0.99]
  weight_decay: 1e-4
  clip_grad_norm: 1.0
  eval_every: 50
  mixed_precision: bf16
  diffusion_mse_lambda: 5
  freeze_gpt: false
  lm_name: gpt2-large
  global_norm: true

# --- Dataset ---
dataset_name: fineweb_100b
fineweb_subset: sample-10BT   # 'sample-10BT' or 'sample-100BT'

# --- Logging & output ---
wandb_name: star-ldm-fineweb
save_dir: saved_models/
